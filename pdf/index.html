<style>
  :root{--ground:#F4F7FB;--surface:#FFFFFF;--ink:#0B1A2E;--ink-2:#34445B;--muted:#627289;--blue:#1F6BEB;--blue-deep:#1552C9;--r-l:20px;--shadow:0 18px 44px rgba(11,26,46,.12);color-scheme:light}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
  a{color:var(--blue-deep)}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}

  /* Les pages de la plaquette, l'une après l'autre. Sur iPhone elles occupent
     toute la largeur : on entre directement dans le document. */
  .pages{display:grid;gap:0}
  .pages figure{position:relative;margin:0;line-height:0}
  .pages img{display:block;width:100%;height:auto;background:#0B1A2E}
  .zone{position:absolute;display:block;border-radius:10px;transition:background .15s ease,box-shadow .15s ease}
  .zone:hover{background:rgba(255,255,255,.14);box-shadow:0 0 0 3px rgba(31,107,235,.55)}
  .zone:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.zone{transition:none}}
  @media (min-width:760px){
    .pages{gap:22px;max-width:820px;margin-inline:auto;padding:26px clamp(16px,3vw,28px) 0}
    .pages img{border-radius:var(--r-l);box-shadow:var(--shadow)}
  }

  .fin{max-width:560px;margin-inline:auto;padding:clamp(26px,6vw,44px) clamp(16px,4vw,28px) 0}
  .fin h2{font-size:clamp(1.4rem,4.4vw,1.9rem);letter-spacing:-.035em;line-height:1.12;margin:0 0 8px;text-wrap:balance}
  .fin p{margin:0 0 20px;color:var(--ink-2);text-wrap:pretty}
  .actions{display:grid;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;font-weight:700;font-size:17px;padding:16px 20px;border-radius:999px;text-align:center;border:0;font-family:inherit;cursor:pointer;width:100%}
  .btn svg{width:19px;height:19px;flex:none}
  .btn--blue{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(31,107,235,.28)}
  .btn--blue:active{background:var(--blue-deep)}
  .btn--ghost{background:var(--surface);color:var(--ink);box-shadow:0 6px 18px rgba(11,26,46,.07)}
  .btn--ghost:active{background:#F1F5FA}
  .sub{margin:12px 0 0;color:var(--muted);font-size:14px;text-align:center;text-wrap:pretty}
  .duo{display:grid;gap:10px}
  @media (min-width:520px){.duo{grid-template-columns:1fr 1fr}}
  footer{padding:26px 20px max(26px,env(safe-area-inset-bottom));color:var(--muted);font-size:13.5px;text-align:center}
  footer a{color:var(--muted)}
  .partage{position:relative}
  .menu{position:absolute;left:0;right:0;bottom:calc(100% + 10px);background:var(--surface);border-radius:18px;box-shadow:0 22px 50px rgba(11,26,46,.22);padding:8px;display:none;z-index:8}
  .menu.on{display:block}
  .menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:12px;border:0;background:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;text-align:left;cursor:pointer}
  .menu a:active,.menu button:active{background:#F1F5FA}
  .menu i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#EEF3F9;flex:none}
  .menu i svg{width:18px;height:18px;stroke:var(--blue-deep)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;font-size:15px;font-weight:600;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

      <a class="zone" href="https://apps.apple.com/app/id6802150703" target="_blank" rel="noopener" aria-label="Télécharger KmPro sur l’App Store" style="left:77.778%;top:90.24%;width:16.514%;height:4.009%"></a>
    </figure>
    <figure class="page">
      <img src="../assets/plaquette/p3.webp" width="1200" height="1698" loading="lazy" alt="Plaquette KmPro, page 3 : des frais kilométriques au plus juste, avec plusieurs itinéraires proposés, les trajets à étapes et les déplacements récurrents.">
      <a class="zone" href="https://kmpro.app/" aria-label="Aller sur kmpro.app" style="left:5.673%;top:91.487%;width:14.119%;height:1.425%"></a>
      <a class="zone" href="https://apps.apple.com/app/id6802150703" target="_blank" rel="noopener" aria-label="Télécharger KmPro sur l’App Store" style="left:77.778%;top:90.24%;width:16.514%;height:4.009%"></a>
    </figure>
    <figure class="page">
      <img src="../assets/plaquette/p4.webp" width="1200" height="1698" loading="lazy" alt="Plaquette KmPro, page 4 : prêt pour votre comptable, avec les exports Excel et PDF mois par mois.">

      <a class="zone" href="https://apps.apple.com/app/id6802150703" target="_blank" rel="noopener" aria-label="Télécharger KmPro sur l’App Store" style="left:37.944%;top:89.26%;width:24.077%;height:5.434%"></a>

  <section class="fin">

    <p>Sans paiement ni carte bancaire. Un seul abonnement pour l’iPhone et le Mac.</p>
    <div class="actions">
      <a class="btn btn--blue" href="https://apps.apple.com/app/id6802150703" target="_blank" rel="noopener">Télécharger sur l’App Store</a>
      <div class="partage">
        <div class="menu" id="menu" role="menu" aria-label="Partager le PDF">
          <a id="m-wa" href="#" target="_blank" rel="noopener" role="menuitem"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 20.5l1.8-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg></i>WhatsApp</a>
          <a id="m-mail" href="#" role="menuitem"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></i>E-mail</a>
          <a id="m-sms" href="#" role="menuitem"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/></svg></i>Message</a>
          <button type="button" id="m-copie" role="menuitem"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></i>Copier le lien</button>
        </div>
        <button class="btn btn--ghost" type="button" id="partager" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg>
          <span>Partager le PDF</span>

        <a class="btn btn--ghost" id="dl" href="../assets/plaquette/KmPro-plaquette.pdf" download="KmPro-plaquette.pdf" type="application/pdf">Télécharger le PDF</a>

<div class="toast" id="toast" role="status" aria-live="polite">Lien copié</div>

<script>
(function(){
  var b = document.getElementById('partager');
  var menu = document.getElementById('menu');
  var toast = document.getElementById('toast');
  var lien = 'https://kmpro.app/pdf/';
  var titre = 'KmPro — Vos kilomètres professionnels, déjà calculés';
  var texte = 'La plaquette KmPro : suivi des frais kilométriques sur iPhone et Mac.';
  var u = encodeURIComponent, message = texte + ' ' + lien;

  document.getElementById('m-wa').href   = 'https://wa.me/?text=' + u(message);
  document.getElementById('m-mail').href = 'mailto:?subject=' + u(titre) + '&body=' + u(texte + '\n\n' + lien);
  // iOS attend « sms:&body= », Android « sms:?body= » : on sert la variante du système.
  var iOS = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  document.getElementById('m-sms').href = 'sms:' + (iOS ? '&' : '?') + 'body=' + u(message);

  function flash(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    setTimeout(function(){ toast.classList.remove('on'); }, 2200);
  }
  function ferme(){ menu.classList.remove('on'); b.setAttribute('aria-expanded','false'); }
  function copier(){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lien).then(function(){ flash('Lien copié'); },
                                              function(){ flash(lien); });
    } else { flash(lien); }
  }

  b.addEventListener('click', function(e){
    e.stopPropagation();
    // Feuille de partage du système quand elle existe : AirDrop, WhatsApp, Messages, Mail…
    if (navigator.share) {
      navigator.share({ title: titre, text: texte, url: lien }).catch(function(err){
        if (err && err.name !== 'AbortError') menu.classList.add('on');
      });
      return;
    }
    var ouvert = menu.classList.toggle('on');
    b.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
  });

  // Téléchargement : on récupère le fichier puis on le remet au système, pour qu'il
  // soit enregistré (Fichiers sur iPhone, Téléchargements sur Mac) au lieu d'être
  // simplement affiché dans le navigateur. Si quoi que ce soit échoue, le lien
  // direct reprend la main.
  var dl = document.getElementById('dl');
  dl.addEventListener('click', function(e){
    if (!window.fetch || !window.URL || !URL.createObjectURL) return;
    e.preventDefault();
    flash('Téléchargement…');
    fetch(dl.href).then(function(r){
      if (!r.ok) throw new Error('indisponible');
      return r.blob();
    }).then(function(blob){
      var url = URL.createObjectURL(new Blob([blob], { type: 'application/pdf' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = 'KmPro-plaquette.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
    }).catch(function(){ window.location.href = dl.href; });
  });

  document.getElementById('m-copie').addEventListener('click', function(){ copier(); ferme(); });
  menu.addEventListener('click', function(e){ if (e.target.closest('a')) ferme(); });
  document.addEventListener('click', function(e){ if (!menu.contains(e.target)) ferme(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') ferme(); });
})();
</script>
